name: CI

#on: [push]

# 在master分支发生push事件时触发。
on:
  push:
    branches:
      - master

env: # 设置环境变量
  TZ: Asia/Shanghai # 时区（设置时区可使页面中的`最近更新时间`使用时区时间）
  NODE_OPTIONS: --openssl-legacy-provider # 兼容 VuePress 1.x (Webpack 4) 在 Node 17+ 环境下的构建

permissions:
  contents: write

jobs:
  build: # 自定义名称
    runs-on: ubuntu-latest # 运行在虚拟机环境ubuntu-latest

    steps:
      - name: Checkout # 检出仓库
        uses: actions/checkout@v4

      - name: Use Node.js 20 # 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Deploy # 安装依赖并构建部署
        env: # 设置环境变量
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }} 
          CODING_TOKEN: ${{ secrets.CODING_TOKEN }}
          GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}
        run: |
          npm install
          npm run deploy
      
